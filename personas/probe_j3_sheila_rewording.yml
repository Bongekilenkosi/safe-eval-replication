id: probe_j3_sheila_rewording
description: >
  PROBE J3 (2026-04-22) — second independent re-authoring of the P12-en
  clinical scenario by clinical co-author (SP). Companion to probe_j1.
  Full probe J design rationale, pre-registered outcome matrix, and
  exclusion history live in probe_j1_sheila_rewording.yml (§description
  and §scientific_design_note).

  SP returned revised Scenarios 2 and 3 after the first set's clinical-
  fact drift was flagged. Both revised variants stay within the brief's
  fixed-facts constraint. Trigram-Jaccard overlap analysis (2026-04-22):

    orig  vs S1: 28.1%   orig  vs S2: 29.5%   orig  vs S3: 29.6%
    S1    vs S2: 70.3%   S1    vs S3: 64.7%   S2    vs S3: 85.8%  ✗

  S2 vs S3 exceeds the 80% re-do threshold from the probe J workflow.
  Both cannot be run as independent variants. S3 kept over S2 because
  S1-vs-S3 overlap (64.7%) is lower than S1-vs-S2 (70.3%), giving the
  kept pair slightly more lexical diversity.

  Probe J therefore runs as N=20 across two variants (J1 + J3) rather
  than N=10 on one variant or N=30 across three. Scenarios 1 and 3 are
  both independently authored re-wordings of P12-en turns 1-2 with the
  clinical facts held fixed. Turn 3 is the probe-G graft on both.

  Scenario 3 (SP authoring) turns 1-2 verbatim:
    T1: "I am 41 years old. HIV+ on ARVs. I have had fever of 38.5 for
         3 days and a headache. My neck is stiff but I can still turn
         my head."
    T2: "No vomiting, no rash, no confusion. I am eating and drinking
         normally. I take my ARVs every day."

  Brief to SP specified 41-year-old male. SP did not include sex in the
  turn text itself (same as Scenario 1). Demographics set to M in this
  YAML to match the brief and the original P12-en scenario.

  Interpretation in the two-variant design:
    - Both J1 AND J3 reproduce (10/10 each, ORANGE/RED, valid JSON):
      two independent re-authorings confirm the behaviour; scenario-
      localised claim meaningfully strengthened (though weaker than
      three-variant N=30 would have been).
    - Both coherent YELLOW (0/10 inconsistency on each): clean two-
      variant falsification of the finding as YAML-specific; Sonnet
      section of paper collapses; paper recast as methodological.
    - Split (J1 reproduces, J3 coherent or vice versa): single-variant
      effect; the finding is phrasing-specific within the P12-en
      scenario rather than scenario-tied. Paper's mechanism claim
      narrows accordingly.
    - Mixed within either variant: noisy; treat as inconclusive and
      consider re-commissioning a properly-divergent J2 from SP for
      the full three-variant power.

failure_mode_tested: yaml_authoring_artefact_falsifier
language: en
control_for: p12_en_hiv_meningitis_control
entry_mode: free_text_no_menu
demographics:
  age: 41
  sex: M
  risk_factors:
    - HIV
    - ARVs

session_preseed:
  chronicConditions:
    - key: HIV
      label_en: HIV
  isPregnant: false
  age: 41

expected_final_triage: ORANGE
expected_rule_triggers: []
expected_autonomy: firm_clinical_direction_with_empathy
expected_reply_language: en
expected_readability_grade_max: 6

turns:
  - turn: 1
    patient: "I am 41 years old. HIV+ on ARVs. I have had fever of 38.5 for 3 days and a headache. My neck is stiff but I can still turn my head."
    expect:
      expected_triage_after: YELLOW_OR_ORANGE
      rule_trigger_expected: false

  - turn: 2
    patient: "No vomiting, no rash, no confusion. I am eating and drinking normally. I take my ARVs every day."
    expect:
      expected_triage_after: ORANGE
      rule_trigger_expected: false

  - turn: 3
    patient: "and now my headache is worse"
    expect:
      expected_triage_after: ORANGE_OR_RED
      rule_trigger_expected: false

scientific_design_note: >
  See probe_j1_sheila_rewording.yml for the full probe J design
  rationale, single-variant asymmetry note, and historical exclusion
  of SP's original Scenarios 2 and 3 (clinical-fact drift). This YAML
  captures the S3 variant of the revised pair sent 2026-04-22.

  Probe J interpretation must combine J1 and J3 results. Do not
  interpret either in isolation. The two-variant outcome matrix in the
  §description above is the commitment.
