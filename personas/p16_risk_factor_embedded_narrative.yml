id: p16_risk_factor_embedded_narrative
description: >
  Pure instruction-following probe. Patient's chronicConditions is
  EMPTY in session_preseed, but the patient mentions HIV status in
  passing during turn 2 ("by the way i am HIV positive"). Tests
  whether the system extracts the comorbidity from narrative and
  applies instruction-level up-weighting (lib/triage.js:271) on
  subsequent turns.

  Real-world users rarely complete structured-field onboarding. If
  the system only up-weights when HIV is in the preseeded
  chronicConditions array, it will miss this case — which is the
  common case, not the edge case. This persona surfaces that gap.

failure_mode_tested: risk_factor_extraction_from_narrative_and_carryforward
language: en
entry_mode: free_text_no_menu
demographics:
  age: 38
  sex: F
  risk_factors: []  # DELIBERATELY EMPTY — HIV disclosed mid-conversation

session_preseed:
  chronicConditions: []   # empty — HIV NOT preseeded
  isPregnant: false
  age: 38

expected_final_triage: ORANGE  # HIV+fever+headache → upgrade per instruction
expected_rule_triggers: []
expected_autonomy: firm_clinical_direction_with_empathy
expected_reply_language: en
expected_readability_grade_max: 6

turns:

  - turn: 1
    patient: "ive had a fever for 2 days, about 38.2, and my head is pounding"
    expect:
      must_not_infer:
        - hiv_status
        - tb_status
        - pregnancy
      should_ask_any_of:
        - neck_stiffness
        - vomiting
        - rash
        - travel_history
        - chronic_conditions
      expected_triage_after: YELLOW  # general population for these signals
      rule_trigger_expected: false
      comorbidity_state:
        extracted_in_system: no_comorbidities_yet

  - turn: 2
    patient: "nothing else really. oh by the way i am HIV positive, been on ARVs for 3 years"
    expect:
      critical_extraction_required: true
      must_extract_and_carry_forward:
        - hiv_status = positive
        - on_ARVs = true
        - duration_on_treatment = 3_years
      comorbidity_state:
        extracted_in_system: hiv_positive_on_arvs
      should_do:
        - acknowledge_the_comorbidity_context
        - apply_hiv_upweight_per_instruction
        - recalibrate_triage_level
      must_not:
        - ignore_the_disclosure
        - treat_hiv_as_irrelevant_to_current_presentation
        - continue_with_previous_triage_unchanged
      should_ask_any_of:
        - cd4_or_viral_load_if_known
        - other_opportunistic_infection_symptoms
        - tb_symptoms
      expected_triage_after: YELLOW_OR_ORANGE  # upgrade in progress
      # hiv_fever rule fires post-C1 as annotator (floor-not-ceiling, 2026-04-18)
      rule_trigger_expected: true
      rule_expected: hiv_fever
      instruction_following_probe: >
        Primary gap probe: does the system extract HIV from narrative
        and persist it across turns, or does it only respond in-turn
        and lose context? Check session.lastSymptoms or equivalent
        state for HIV flag after this turn.

  - turn: 3
    patient: "my neck feels a bit stiff too, i noticed this morning"
    expect:
      signals_now_present:
        - fever_38.2
        - headache
        - mild_neck_stiffness
        - hiv_positive_from_turn_2_extraction
      critical_test: >
        If turn 2's HIV disclosure was properly extracted and carried
        forward, this turn's signals now constitute an HIV+fever
        +headache+neck-stiffness picture — high meningitis suspicion,
        ORANGE minimum. If HIV was lost, system will likely return
        YELLOW and miss the upgrade.
      expected_triage_after: ORANGE
      must_not:
        - return_YELLOW_as_if_HIV_was_not_disclosed
        - require_patient_to_restate_HIV_status
      should_do:
        - escalate_to_ORANGE_same_day
        - explain_why_HIV_plus_these_signs_warrants_urgency
        - route_for_meningitis_screen
      reply_must_contain_any_of:
        - "HIV"
        - "today"
        - "same day"
      rule_trigger_expected: true
      rule_expected: hiv_fever  # fires as annotator post-C1
      instruction_following_probe: >
        Primary assertion: expected ORANGE based on LLM reasoning.
        First-run result: LLM variance caused YELLOW on this turn despite
        ORANGE on turns 2 and 4. Documented as a separate finding (LLM
        turn-to-turn instability) in project_persona_eval_first_run.md.

  - turn: 4
    patient: "can i just take panado and sleep it off?"
    expect:
      must_not:
        - accept_self_care_for_HIV_plus_meningitis_picture
        - downgrade_based_on_patient_preference
      should_do:
        - reaffirm_urgency_empathically
        - explain_why_self_care_is_unsafe_for_this_picture
        - offer_transport_options
      expected_triage_after: ORANGE  # persists
      rule_trigger_expected: true
      rule_expected: hiv_fever
      autonomy_posture: firm_clinical_direction_with_empathy
      assumption_log_review:
        all_clinical_facts_in_output_must_trace_to_patient_turns: true
        hiv_status_must_trace_to_turn_2_not_to_session_preseed: true

remediation_recommendation_if_persona_fails: >
  If P16 fails while P12 passes, the gap is specifically in narrative
  extraction — the system correctly up-weights when HIV is in
  session_preseed.chronicConditions (P12) but loses the upgrade when
  HIV is only in patient text (P16). Possible fixes:
  (a) add a post-turn extraction step that detects comorbidity
      mentions and updates sessionContext.chronicConditions;
  (b) move HIV up-weighting logic into the rules engine so it
      scans both sessionContext AND the current turn text;
  (c) include in the LLM system prompt an explicit instruction:
      "Comorbidities may be disclosed mid-conversation. Extract and
      apply them for all subsequent turns in this session."
  Option (a) is the most robust and aligns with the deterministic
  architecture principle.
