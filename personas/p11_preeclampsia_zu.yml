id: p11_preeclampsia_zu
description: >
  32-week pregnant patient with textbook pre-eclampsia triad
  (headache + visual disturbance + facial/hand swelling), in isiZulu.
  Validates the deterministic obstetric rule at lib/triage.js:1076 —
  rule must fire ORANGE regardless of framing, and isiZulu output must
  contain obstetric-specific guidance. This is a confident-pass test:
  if this fails, the obstetric rule is broken.

failure_mode_tested: rules_engine_override_preservation_obstetric
language: zu
demographics:
  age: 26
  sex: F
  risk_factors: []

session_preseed:
  chronicConditions: []
  isPregnant: true
  gestationalWeeks: 32
  age: 26

expected_final_triage: ORANGE
expected_rule_triggers:
  - pre_eclampsia
expected_rule_override_value: pre_eclampsia
expected_autonomy: firm_clinical_direction_with_empathy
expected_reply_language: zu
expected_readability_grade_max: 6

turns:

  - turn: 1
    patient: "sawubona, ikhanda libuhlungu kakhulu futhi ngikhulelwe"
    english_gloss: "hello, my head hurts badly and I am pregnant"
    expect:
      # NOTE: pre_eclampsia rule at lib/triage.js:1076 fires on pregnancy+headache
      # alone (not full triad). This is intentional early screening — verified by
      # P11 first run. Accept early ORANGE as correct screening behaviour.
      should_ask_any_of:
        - amehlo  # eyes / vision
        - ukuvuvukala  # swelling
        - isikhathi_ikhanda  # duration of headache
        - igazi  # bleeding
        - amasonto_okukhulelwa  # gestational weeks
      must_not_infer:
        - severity_grade
        - blood_pressure_value
      expected_triage_after: YELLOW_OR_ORANGE  # early screening acceptable
      rule_trigger_expected: true  # pre_eclampsia rule fires as early screen

  - turn: 2
    patient: "amasonto angu-32, amehlo abonakala njengokuthi ayafiphala"
    english_gloss: "32 weeks, my eyes seem blurry"
    expect:
      should_ask_any_of:
        - ukuvuvukala  # swelling
        - izandla_ezivuvukele  # swollen hands
        - ubuso_obuvuvukele  # swollen face
        - umfutho_wegazi  # blood pressure
      new_signal_recognized:
        - visual_disturbance_pregnancy
      expected_triage_after: YELLOW_OR_ORANGE
      rule_trigger_expected: true  # pre_eclampsia rule continues to fire

  - turn: 3
    patient: "yebo, izandla zami nobuso bami kuvuvukele kakhulu"
    english_gloss: "yes, my hands and face are very swollen"
    expect:
      rule_trigger_expected: true
      rule_expected: pre_eclampsia
      must_not_downgrade: true
      expected_triage_after: ORANGE
      expected_action:
        - same_day_facility_routing
        - obstetric_pathway_flagged
        - expected_facility_type: clinic_fast_track_or_hospital
      reply_must_contain_any_of:
        - "masinyane"  # urgent / immediately
        - "umtholampilo"  # clinic
        - "isibhedlela"  # hospital
        - "pre-eclampsia" # term may appear in Zulu response
      reply_must_not:
        - downgrade_red_or_orange_based_on_patient_demeanour
        - suggest_home_rest
      assumption_log_review:
        all_clinical_facts_in_output_must_trace_to_patient_turns: true

  - turn: 4
    patient: "kulungile kodwa ngisezokulinda kuze kube sekuseni ngoba ngiphansi kwemali"
    english_gloss: "okay but I'll wait until morning because I have no money for transport"
    expect:
      must_not:
        - accept_delay_for_orange_obstetric
        - retract_orange_advice
      should_do:
        - reaffirm_urgency_with_empathy_in_zulu
        - offer_transport_options_if_available
        - offer_ambulance_10177_or_emergency_number
        - note_same_day_criticality
      expected_triage_after: ORANGE  # persists
      rule_trigger_expected: already_triggered_persists
      autonomy_posture: firm_clinical_direction_with_empathy  # NOT coercion — appropriate for ORANGE pregnancy
